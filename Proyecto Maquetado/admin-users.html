<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Users - CrowdSpark</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   
    <header class="header">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <a href="index.html" class="logo">
            <img src="img/Logo1.png" alt="CrowdSpark" class="logo-icon">
            <span>CrowdSpark</span>
        </a>
        <nav class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="explore-projects.html" class="nav-link">
                <i class="fas fa-compass"></i>
                <span>Explore Projects</span>
            </a>
            <a href="register.html" class="nav-link">
                <i class="fas fa-user-plus"></i>
                <span>Register</span>
            </a>
            <a href="login.html" class="nav-link">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </a>
            <a href="my-projects.html" class="nav-link">
                <i class="fas fa-folder"></i>
                <span>My Projects</span>
            </a>
            <a href="saved-projects.html" class="nav-link">
                <i class="fas fa-star"></i>
                <span>Saved Projects</span>
            </a>
            <a href="my-contributions.html" class="nav-link">
                <i class="fas fa-wallet"></i>
                <span>My Contributions</span>
            </a>
            <a href="admin-review.html" class="nav-link active">
                <i class="fas fa-shield-alt"></i>
                <span>Admin Dashboard</span>
            </a>
        </nav>
    </header>

    <div class="container">
        <h1 class="hero-title">Admin — Users</h1>
        
        
        <div class="admin-form-section">
            <form>
                <div class="form-group">
                    <label class="form-label" for="adminEmail">Admin Email</label>
                    <input type="email" id="adminEmail" class="form-input" placeholder="admin@example.com" required>
                    <div class="error-message">Enter a valid email.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" class="form-input" placeholder="Set password" required>
                    <div class="error-message">Required</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Create Admin</button>
                </div>
            </form>
        </div>

      
        <div class="admin-list">
            <h2 class="hero-title" style="font-size: 1.5rem; margin-bottom: 1.5rem;">Existing Admins</h2>
            <div class="admin-item">
                <span class="admin-email">superadmin@example.com</span>
                <div class="table-actions">
                    <button class="btn btn-outline">Edit</button>
                    <button class="btn btn-outline">Delete</button>
                </div>
            </div>
            <div class="admin-item">
                <span class="admin-email">admin@example.com</span>
                <div class="table-actions">
                    <button class="btn btn-outline">Edit</button>
                    <button class="btn btn-outline">Delete</button>
                </div>
            </div>
            <div class="admin-item">
                <span class="admin-email">moderator@example.com</span>
                <div class="table-actions">
                    <button class="btn btn-outline">Edit</button>
                    <button class="btn btn-outline">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('menuToggle')?.addEventListener('click', function() {
            document.getElementById('navLinks')?.classList.toggle('active');
        });
    </script>
</body>
</html>
