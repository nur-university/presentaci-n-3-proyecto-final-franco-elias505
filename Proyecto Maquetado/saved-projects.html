<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Projects - CrowdSpark</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   
    <header class="header">
        <button class="menu-toggle" id="menuToggle">
            <i class="fas fa-bars"></i>
        </button>
        <a href="index.html" class="logo">
            <img src="img/Logo1.png" alt="CrowdSpark" class="logo-icon">
            <span>CrowdSpark</span>
        </a>
        <nav class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link">
                <i class="fas fa-home"></i>
                <span>Home</span>
            </a>
            <a href="explore-projects.html" class="nav-link">
                <i class="fas fa-compass"></i>
                <span>Explore Projects</span>
            </a>
            <a href="register.html" class="nav-link">
                <i class="fas fa-user-plus"></i>
                <span>Register</span>
            </a>
            <a href="login.html" class="nav-link">
                <i class="fas fa-sign-in-alt"></i>
                <span>Login</span>
            </a>
            <a href="my-projects.html" class="nav-link">
                <i class="fas fa-folder"></i>
                <span>My Projects</span>
            </a>
            <a href="saved-projects.html" class="nav-link active">
                <i class="fas fa-star"></i>
                <span>Saved Projects</span>
            </a>
            <a href="my-contributions.html" class="nav-link">
                <i class="fas fa-wallet"></i>
                <span>My Contributions</span>
            </a>
            <a href="admin-review.html" class="nav-link">
                <i class="fas fa-shield-alt"></i>
                <span>Admin Dashboard</span>
            </a>
        </nav>
    </header>

    <div class="container">
        <h1 class="hero-title">Saved Projects</h1>
        
        <div class="projects-grid">
           
            <div class="project-card">
                <img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=800&h=600&fit=crop" alt="Eco Bottle" class="project-image">
                <div class="project-content">
                    <h3 class="project-title">Eco Bottle</h3>
                    <div class="project-info">
                        <span>Goal $3,000</span>
                        <span>by Oct 10</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 65%"></div>
                    </div>
                    <div class="project-funding">
                        <span>65% funded</span>
                        <span>by Sarah</span>
                    </div>
                    <div class="project-actions">
                        <a href="#" class="btn btn-secondary">View Details</a>
                    </div>
                </div>
            </div>

            
            <div class="project-card">
                <img src="https://images.unsplash.com/photo-1512941937669-90a1b58e7e9c?w=800&h=600&fit=crop" alt="Mindful App" class="project-image">
                <div class="project-content">
                    <h3 class="project-title">Mindful App</h3>
                    <div class="project-info">
                        <span>Goal $12,000</span>
                        <span>by Nov 01</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: 42%"></div>
                    </div>
                    <div class="project-funding">
                        <span>42% funded</span>
                        <span>by Tom</span>
                    </div>
                    <div class="project-actions">
                        <a href="#" class="btn btn-secondary">View Details</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('menuToggle')?.addEventListener('click', function() {
            document.getElementById('navLinks')?.classList.toggle('active');
        });
    </script>
</body>
</html>
