<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your account - CrowdSpark</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="form-container">
        <h1 class="form-title">Create your account</h1>
        
        <form>
            <div class="form-group">
                <label class="form-label" for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-input" placeholder="e.g., Jane Doe" required>
                <div class="error-message">Full name is required.</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                <div class="error-message">Enter a valid email address.</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
                <div class="form-hint">Use at least 6 characters.</div>
                <div class="error-message">Password must be at least 6 characters.</div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Account</button>
            </div>
        </form>

        <div class="info-cards">
            <div class="info-card">
                <div class="info-card-title">Next Step</div>
                <div class="info-card-text">Check your email to activate</div>
            </div>
            <div class="info-card">
                <div class="info-card-title">Why join?</div>
                <div class="info-card-text">Save projects & donate</div>
            </div>
            <div class="info-card">
                <div class="info-card-title">Support</div>
                <div class="info-card-text">We're here to help</div>
            </div>
        </div>
    </div>
</body>
</html>
